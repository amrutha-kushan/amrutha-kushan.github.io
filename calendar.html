<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Add to calendar · Gruhapravesha · Amrutha &amp; Kushan</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 35%, #6a1828, #2c0710 75%); color: #fff6e6; font: 16px/1.5 Georgia, 'Times New Roman', serif; text-align: center; }
  main { width: min(100% - 48px, 400px); padding: 40px 0; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { margin: 18px 0 6px; font-weight: 400; font-size: 32px; }
  p { margin: 0 0 26px; color: #e2c9b6; font: 15px/1.6 Helvetica, Arial, sans-serif; }
  a.choice { display: block; margin: 12px 0; padding: 15px 22px; border-radius: 999px; border: 1px solid #d4a64a; color: #efd38e; text-decoration: none; font: 600 15px Helvetica, Arial, sans-serif; }
  a.primary { background: #e3c375; border-color: #e3c375; color: #3d0a16; }
  a.back { display: inline-block; margin-top: 18px; color: #b89a8a; font: 13px Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<main>
  <img src="./apple-touch-icon.png" alt="">
  <h1>Add to your calendar</h1>
  <p>Gruhapravesha · Amrutha &amp; Kushan<br>Sunday, November 1, 2026 · 11:00 AM<br>678 Ohlone St, Milpitas, CA 95035</p>
  <a class="choice primary" id="google" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Gruhapravesha%20%C2%B7%20Amrutha%20%26%20Kushan&amp;dates=20261101T190000Z/20261101T220000Z&amp;ctz=America%2FLos_Angeles&amp;location=678%20Ohlone%20St%2C%20Milpitas%2C%20CA%2095035&amp;details=Our%20Gruhapravesha%20(housewarming).%20The%20ceremony%20begins%20at%2011%3A00%20AM%2C%20followed%20by%20lunch.%0ADetails%20and%20RSVP%3A%20https%3A%2F%2Famruthakushan.com%2F">Google Calendar</a>
  <a class="choice" id="ics" href="./gruhapravesha.ics">Apple Calendar or Outlook</a>
  <a class="back" href="./">Back to the invitation</a>
</main>
<script>
  // Phones go straight to their calendar; Back returns here to choose another.
  var ua = navigator.userAgent;
  var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) location.replace('./gruhapravesha.ics');
  else if (/Android/i.test(ua)) location.replace(document.getElementById('google').href);
</script>
</body>
</html>
